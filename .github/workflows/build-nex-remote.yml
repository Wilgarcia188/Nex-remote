name: Build Nex Remote APK

on:
  push:
    branches:
      - 'claude/**'
      - 'main'
    paths:
      - 'nex_remote/**'
      - '.github/workflows/build-nex-remote.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nex_remote

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.2'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Build release APK (debug-signed)
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/nex-remote-${VERSION}-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: nex-remote-release-apk
          path: nex_remote/build/app/outputs/flutter-apk/nex-remote-*-release.apk
          retention-days: 3

      - name: APK info
        run: |
          APK=$(ls build/app/outputs/flutter-apk/nex-remote-*-release.apk)
          SIZE=$(du -h "$APK" | cut -f1)
          echo "APK: $APK"
          echo "Size: $SIZE"
